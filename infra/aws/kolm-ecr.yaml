AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECR repository for the kolm API image. Separate from the service stack so
  the first image can be pushed before the ECS service exists. Tags are
  mutable because deploys move the `prod` tag (see
  .github/workflows/deploy-aws.yml and scripts/aws/rollback.sh).

Parameters:
  RepositoryName:
    Type: String
    Default: kolm/api
    AllowedPattern: '^[a-z0-9][a-z0-9._/-]*$'
  KeepImages:
    Type: Number
    Default: 30
    MinValue: 5
    Description: How many most-recent images the lifecycle policy keeps.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "keep the ${KeepImages} most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${KeepImages}
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-RepositoryUri'
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RepositoryArn'
  RepositoryName:
    Value: !Ref Repository
    Export:
      Name: !Sub '${AWS::StackName}-RepositoryName'
