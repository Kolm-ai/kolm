[project]
name = "kolm-pixel"
version = "0.1.0"
description = "Verifiable image-quality claims against a physical camera floor, plus the data pipeline that feeds a restoration/edit model."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Collector + parquet decoding. requests is already in the repo's Python envs.
data = ["requests>=2.31", "pyarrow>=15.0"]
# Model training / editing. CPU wheels are enough for the smoke test.
train = ["torch>=2.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pixel*"]

[tool.ruff]
line-length = 110
target-version = "py310"
