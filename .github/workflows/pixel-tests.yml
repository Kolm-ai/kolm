name: pixel-tests
on:
  pull_request:
    paths:
      - 'apps/pixel/**'
      - '.github/workflows/pixel-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/pixel/**'
      - '.github/workflows/pixel-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/pixel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/pixel/pyproject.toml
      - run: python -m pip install -e ".[data,dev]"
      - name: pytest (CPU; the model and measurement extras are exercised locally on the GPU box)
        run: mkdir -p .tmp && python -m pytest -q -p no:cacheprovider --basetemp=.tmp/pt
      - name: demo
        run: python -m harness demo --out demo_out
