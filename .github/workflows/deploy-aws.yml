name: deploy-aws

# Builds the API image, pushes it to ECR as <sha> and `prod`, then rolls the
# kolm-api ECS service. Inert until the AWS_DEPLOY_ROLE_ARN repository
# variable is set (DeployRoleArn output of infra/aws/github-oidc.yaml), so it
# can land before the AWS cutover. Run it by hand with roll=false to push the
# first image before the service exists. Roll back with scripts/aws/rollback.sh <sha>.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'apps/pixel/**'
  workflow_dispatch:
    inputs:
      roll:
        description: Roll the ECS service after pushing (off for the first push, before the service exists)
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kolm/api
  ECS_CLUSTER: kolm-api
  ECS_SERVICE: kolm-api

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the service
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.roll }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --query 'service.deployments[0].id' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify /health reports this commit
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.roll) && vars.KOLM_API_HOST != '' }}
        run: |
          for i in $(seq 1 20); do
            body="$(curl -fsS "https://${{ vars.KOLM_API_HOST }}/health" || true)"
            if printf '%s' "$body" | grep -q "${GITHUB_SHA:0:7}"; then
              echo "live: $body"; exit 0
            fi
            sleep 6
          done
          echo "::error::/health never reported $GITHUB_SHA"; printf '%s\n' "$body"; exit 1
